<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>H3 Live</title>
<meta name="description" content="用手機藍牙直接連 H3 腦波儀，即時看波形、錄製 EDF、產生腦健康報告">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#06090f">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<style>
:root{
  --bg:#06090f;--fg:#e8ecf4;--muted:#6e7a92;
  --card:#0d1117;--card2:#111922;
  --border:#1a2332;--border-hi:#253245;
  --accent:#00bcd4;--accent2:#26c6da;--accent-dim:rgba(0,188,212,.1);--accent-glow:rgba(0,188,212,.25);
  --rec:#ff5252;--green:#00e676;--amber:#ffab40;
  --mono:'ui-monospace','SF Mono','Menlo','Cascadia Mono',monospace;
}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]){
  --bg:#eef1f6;--fg:#111827;--muted:#6b7685;
  --card:#fff;--card2:#f5f7fb;
  --border:#dce1ea;--border-hi:#c5cdd9;
  --accent:#0097a7;--accent2:#00acc1;--accent-dim:rgba(0,151,167,.08);--accent-glow:rgba(0,151,167,.18);
  --rec:#d32f2f;--green:#2e7d32;--amber:#f57c00;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.45 system-ui,-apple-system,"Noto Sans TC",sans-serif;
  padding:0 0 calc(12px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;min-height:100dvh}

/* ── header ── */
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:10px 16px;
  background:linear-gradient(135deg,var(--card) 0%,var(--card2) 100%);
  border-bottom:2px solid var(--accent);position:sticky;top:0;z-index:10}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:28px;height:28px;flex-shrink:0}
h1{font-size:18px;margin:0;font-weight:800;letter-spacing:1px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.status{font:700 10px/1 var(--mono);padding:5px 12px;border-radius:4px;
  background:var(--border);color:var(--muted);white-space:nowrap;letter-spacing:1.5px;text-transform:uppercase;
  border:1px solid var(--border-hi)}
.status.on{background:rgba(0,230,118,.12);color:var(--green);border-color:rgba(0,230,118,.3);
  box-shadow:0 0 12px rgba(0,230,118,.15)}
.status.err{background:rgba(255,82,82,.12);color:var(--rec);border-color:rgba(255,82,82,.3)}
.status.wait{background:rgba(255,171,64,.12);color:var(--amber);border-color:rgba(255,171,64,.3);
  animation:blink-status 1.2s ease-in-out infinite}
@keyframes blink-status{0%,100%{opacity:1}50%{opacity:.5}}
.header-right{margin-left:auto;display:flex;align-items:center;gap:8px}

#browserWarn{display:none;background:var(--rec);color:#fff;padding:10px 16px;font-size:14px}
#browserWarn a{display:inline-block;margin-top:8px;background:#fff;color:var(--rec);font-weight:700;padding:8px 14px;border-radius:8px;text-decoration:none}

/* ── main content ── */
.content{flex:1;display:flex;flex-direction:column;gap:10px;padding:10px 14px}

/* ── chart ── */
#chart{width:100%;height:46vh;min-height:220px;border-radius:0;background:var(--bg);display:block;touch-action:none;
  border-top:1px solid var(--border);border-bottom:1px solid var(--border)}

/* ── controls ── */
.controls{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.controls .wide{grid-column:1/-1}
button,select{font:inherit;font-size:13px;padding:10px 12px;border-radius:8px;
  border:1px solid var(--border);background:var(--card);color:var(--fg);cursor:pointer;min-height:42px;
  transition:all .15s}
button:active:not(:disabled){transform:scale(.97)}
button:disabled{opacity:.3;cursor:default}
#btnConnect{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;font-weight:700;
  box-shadow:0 2px 12px var(--accent-glow);letter-spacing:.5px}
#btnRec{color:var(--rec);font-weight:700;border-color:rgba(255,82,82,.4)}
#btnRec.recording{background:var(--rec);color:#fff;border-color:transparent;
  animation:pulse-rec 1.6s ease-in-out infinite}
@keyframes pulse-rec{0%,100%{box-shadow:0 0 0 0 rgba(255,82,82,.35)}50%{box-shadow:0 0 0 10px rgba(255,82,82,0)}}
#btnReport{font-weight:600;color:var(--accent)}
.sub{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;color:var(--muted);padding:0 2px}
.sub button{min-height:0;padding:3px 10px;font-size:11px;border-radius:6px}

/* ── live tiles ── */
.live{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:14px 16px;display:flex;flex-direction:column;gap:8px;
  position:relative;overflow:hidden}
.tile::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--accent);border-radius:3px 0 0 3px;opacity:.4;transition:opacity .3s}
.tile.active::before{opacity:1;box-shadow:0 0 8px var(--accent-glow)}
.tile .label{font-size:10px;color:var(--muted);letter-spacing:1.2px;text-transform:uppercase;font-weight:700}
.tile .score-row{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.tile b{font:800 42px/1 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-2px;
  background:linear-gradient(180deg,var(--fg) 30%,var(--muted));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.tile em{font-style:normal;font-size:10px;padding:3px 10px;border-radius:4px;
  background:var(--card2);border:1px solid var(--border);
  color:var(--muted);font-weight:700;white-space:nowrap;letter-spacing:.5px}
.tile .bar-wrap{height:4px;border-radius:2px;background:var(--border);overflow:hidden}
.tile .bar-fill{height:100%;width:0;border-radius:2px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  transition:width .6s ease-out;box-shadow:0 0 6px var(--accent-glow)}

/* ── stats ── */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:2px;
  background:var(--border);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.stats div{background:var(--card);padding:5px 10px}
.stats div span{color:var(--muted);display:block;font-size:9px;text-transform:uppercase;letter-spacing:.8px;font-weight:600}
.stats div b{font:600 12px/1.4 var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.stats .wide{grid-column:1/-1}

/* ── log ── */
#log{font:10px/1.5 var(--mono);background:var(--card);border:1px solid var(--border);
  border-radius:8px;padding:8px 10px;height:110px;overflow:auto;white-space:pre-wrap;word-break:break-all;
  color:var(--muted)}
#log .err{color:var(--rec)}#log .warn{color:var(--amber)}#log .ok{color:var(--green)}
.note{font-size:11px;color:var(--muted);margin:0;padding:0 2px}

/* ── landscape (phone & tablet) ── */
@media (orientation:landscape) and (min-width:640px){
  html,body{height:100dvh}
  .content{flex:1;display:grid;grid-template-columns:minmax(0,1fr) clamp(280px,28vw,380px);
    gap:10px;height:0;min-height:0;overflow:hidden}
  #chart{height:100%;min-height:0}
  .side{min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-right:2px;display:flex;flex-direction:column;gap:8px}
  #log{height:auto;flex:1;min-height:60px}
  .note{display:none}
}
@media (orientation:landscape) and (min-width:640px) and (max-height:600px){
  header{padding:6px 12px}
  .content{gap:6px;padding:6px 10px}
  h1{font-size:15px}
  .brand svg{width:22px;height:22px}
  .status{font-size:9px;padding:3px 8px}
  .side{gap:4px}
  .controls{gap:4px}
  button,select{min-height:32px;padding:5px 8px;font-size:12px;border-radius:6px}
  .sub{font-size:10px}
  .stats div{padding:4px 8px}
  .stats div span{font-size:8px}
  .stats div b{font-size:10px}
  .tile{padding:8px 10px;border-radius:8px;gap:4px}.tile b{font-size:28px}.tile .label{font-size:8px}.tile em{font-size:8px;padding:2px 6px}
  #log{height:70px;flex:none;font-size:9px;padding:4px 7px;border-radius:6px}
}

/* ── dialogs ── */
dialog{border:none;border-radius:14px;padding:20px;background:var(--card);color:var(--fg);
  width:min(92vw,380px);box-shadow:0 8px 40px rgba(0,0,0,.5);border:1px solid var(--border)}
dialog::backdrop{background:rgba(0,0,0,.7);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
dialog h2{margin:0 0 10px;font-size:16px}
dialog label{display:block;font-size:13px;color:var(--muted);margin-top:8px}
dialog input,dialog select{width:100%;font:inherit;padding:9px 10px;border-radius:8px;
  border:1px solid var(--border);background:var(--bg);color:var(--fg);margin-top:4px;min-height:0}
dialog .row{display:flex;gap:8px;margin-top:14px}
dialog .row button{flex:1}

/* ── report overlay ── */
#reportOverlay{position:fixed;inset:0;background:rgba(2,6,23,.95);z-index:9999;display:none;flex-direction:column;padding:10px;gap:8px}
#reportOverlay.show{display:flex}
#reportOverlay .bar{display:flex;gap:8px;flex-shrink:0}
#reportOverlay .bar button{flex:1;background:var(--accent);color:#fff;border:none;font-weight:600}
#reportOverlay .bar button.ghost{background:#475569}
#reportFrame{flex:1;width:100%;border:none;border-radius:10px;background:#f2f6fb}
</style>
</head>
<body>
<div id="browserWarn">目前是<b>三星瀏覽器</b>，它的藍牙清單永遠是空的。請改用 Chrome 開啟，並在 Chrome 裡「加到主畫面」。<br><a id="openChrome" href="#">用 Chrome 開啟</a></div>
<header>
  <div class="brand">
    <svg viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="14" stroke="var(--accent)" stroke-width="1.5" opacity=".3"/>
    <path d="M6 16 Q10 8,14 16 T22 16 T30 16" stroke="var(--accent)" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M2 16 Q6 24,10 16 T18 16 T26 16" stroke="var(--accent2)" stroke-width="1.5" fill="none" stroke-linecap="round" opacity=".5"/></svg>
    <h1>H3 LIVE</h1>
  </div>
  <div class="header-right">
    <span id="status" class="status off">STANDBY</span>
  </div>
</header>

<div class="content">
<canvas id="chart"></canvas>

<div class="side">
  <div class="controls">
    <button id="btnConnect">連線 H3</button>
    <button id="btnDisconnect" disabled>斷線</button>
    <button id="btnRec" class="wide" disabled>● 開始錄製</button>
    <button id="btnCh" title="切換顯示 2 或 4 通道">4ch</button>
    <select id="scale" title="每軌振幅">
      <option value="50">±50 µV</option><option value="100">±100 µV</option><option value="200" selected>±200 µV</option><option value="500">±500 µV</option><option value="2000">±2000 µV</option>
    </select>
    <button id="btnReport" class="wide" disabled>產生腦健康報告</button>
  </div>
  <div class="live">
    <div class="tile" id="liveStress"><div class="label">壓力與神經平衡</div><div class="score-row"><b>—</b><em>等待訊號</em></div><div class="bar-wrap"><div class="bar-fill"></div></div></div>
    <div class="tile" id="liveFocus"><div class="label">專注與警覺</div><div class="score-row"><b>—</b><em>等待訊號</em></div><div class="bar-wrap"><div class="bar-fill"></div></div></div>
  </div>
  <div class="sub"><span>找不到裝置時：</span><button id="btnConnectAll">列出全部藍牙裝置</button></div>

  <div class="stats">
    <div><span>樣本數</span><b id="stSamples">0</b></div>
    <div><span>取樣率</span><b id="stRate">—</b></div>
    <div><span>電池</span><b id="stBat">—</b></div>
    <div><span>區塊/丟/錯/框</span><b id="stBlocks">—</b></div>
    <div><span>錄製</span><b id="stRec">—</b></div>
    <div><span>通知/位元組</span><b id="stNotif">0</b></div>
    <div class="wide"><span>峰對峰 µV (1s)</span><b id="stPP">—</b></div>
  </div>

  <div class="sub"><span>紀錄</span><button id="btnClear">清除</button></div>
  <div id="log"></div>
  <p class="note">顯示用 0.5 Hz 高通去直流；錄製存原始值。報告需錄 ≥30 秒，建議閉眼靜坐 3 分鐘。</p>
</div>
</div>

<dialog id="stopDlg">
  <h2>錄製完成 <span id="stopSecs" style="font-weight:400;color:var(--muted);font-size:13px"></span></h2>
  <p style="margin:0 0 6px;font-size:13px;color:var(--muted)">要怎麼處理這段錄音？之後仍可按「產生腦健康報告」。</p>
  <div class="row" style="flex-direction:column">
    <button id="stopSaveEdf" type="button">儲存 EDF 檔</button>
    <button id="stopReport" type="button" style="background:var(--accent);color:#fff;border:none;font-weight:600">直接產生報告</button>
    <button id="stopLater" type="button">稍後再說</button>
  </div>
</dialog>

<dialog id="reportDlg">
  <h2>腦健康報告</h2>
  <label>姓名<input id="rpName" placeholder="未命名" autocomplete="off"></label>
  <label>年齡<input id="rpAge" inputmode="numeric" placeholder="選填"></label>
  <label>性別<select id="rpSex"><option value="">不填</option><option>男</option><option>女</option></select></label>
  <div class="row"><button id="rpCancel" type="button">取消</button><button id="rpOk" type="button" style="background:var(--accent);color:#fff;border:none;font-weight:600">產生</button></div>
</dialog>

<div id="reportOverlay">
  <div class="bar">
    <button id="rpPrint">列印／存 PDF</button>
    <button id="rpSave">下載 HTML</button>
    <button id="rpClose" class="ghost">關閉</button>
  </div>
  <iframe id="reportFrame" title="報告"></iframe>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
